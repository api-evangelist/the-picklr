domain_standard:
  applicable: false
  note: >-
    Indoor pickleball club franchising has no machine-readable domain interchange standard.
    DUPR ratings are referenced in Picklr league material as a player-rating service, but no
    DUPR identifier scheme, schema or endpoint appears anywhere in this deployment's contract,
    so no domain-standard conformance is asserted. Reward-only: the absence is not a defect.
compliance_certifications: []
compliance_note: >-
  No trust center, SOC 2, ISO 27001, PCI or HIPAA attestation is published on thepicklr.com.
  trust.thepicklr.com does not resolve and /security/ returns 404.
