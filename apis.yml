apis:
- name: The Picklr WordPress REST API
  description: >-
    The public read surface of thepicklr.com, served by WordPress core and the site's plugins.
    Anonymous GET returns the franchise's own published content — 157 club location records,
    53 pages, 23 blog posts, 5 press items and 4 events — with page-number pagination,
    X-WP-Total headers and sparse-fieldset support. Writes require a WordPress Application
    Password and are not offered to third parties. No OpenAPI is published by the provider;
    the description in openapi/ is a mechanical transform of the route index the site serves
    at /wp-json/, restricted to routes whose anonymous access was individually verified.
  humanURL: https://thepicklr.com/wp-json/
  baseURL: https://thepicklr.com/wp-json
  tags:
