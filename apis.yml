apis:
- name: The Picklr MCP Server
  description: >-
    Three Model Context Protocol endpoints registered under the mcp REST namespace on thepicklr.com, exposed
    by the Novamira WordPress plugin (v1.11.4). The canonical one, /wp-json/mcp/novamira-oauth, is named
    as the protected resource by the site's RFC 9728 metadata and is gated by OAuth 2.1 with a single
    scope, "mcp". tools/list returns HTTP 401 anonymously, so the live tool set and its input schemas
    were not enumerated and are not asserted. This is a site-management agent surface over the marketing
    site, not a booking or membership API.
  humanURL: https://thepicklr.com/wp-json/mcp
  baseURL: https://thepicklr.com/wp-json/mcp/novamira-oauth
