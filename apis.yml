aid: the-picklr
name: The Picklr
description: >-
  The Picklr is the largest indoor pickleball club franchise in North America, founded in 2021
  in Utah by Jorge Barragan and Austin Wood and franchising since March 2023. It operates
  membership-based indoor facilities offering unlimited court reservations, open play, adult
  and junior coaching academies, leagues, tournaments and corporate events, with a single
  membership valid at every club nationwide. The company publishes no developer programme and
  sells no API product. It does, however, serve a genuine machine-readable surface from its own
  domain: a public WordPress REST API exposing 157 club locations plus pages, posts, press and
  events; a published llms.txt; and three live Model Context Protocol endpoints advertised
  through RFC 8414 and RFC 9728 discovery documents and gated by an OAuth 2.1 authorization
  server with PKCE and dynamic client registration. Court booking, membership billing and
  reservations run on PlayByPoint, a third-party platform, and are outside any Picklr-owned
  contract.
